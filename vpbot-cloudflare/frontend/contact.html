<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liên hệ - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">VP<span class="dot">Bot</span></a>
    <nav class="nav-menu">
      <a href="index.html">Trang chủ</a>
      <a href="pricing.html">Bảng giá</a>
      <a href="scoring.html">Tính điểm FF</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Liên hệ</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle"></button>
      <a href="login.html" class="btn btn-ghost btn-sm">Đăng nhập</a>
      <a href="register.html" class="btn btn-primary btn-sm">Thuê ngay</a>
      <button class="btn-icon mobile-menu-btn">☰</button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Liên hệ</span>
      <h2>Chúng tôi luôn sẵn sàng hỗ trợ</h2>
    </div>

    <div class="contact-grid">
      <div>
        <div class="contact-info-item">
          <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
          <div><strong>Hotline</strong><p>0909 xxx xxx</p></div>
        </div>
        <div class="contact-info-item">
          <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg></div>
          <div><strong>Email</strong><p>support@vpbot.vn</p></div>
        </div>
        <div class="contact-info-item">
          <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div><strong>Địa chỉ</strong><p>TP. Hồ Chí Minh, Việt Nam</p></div>
        </div>
        <div class="map-embed">
          <iframe title="map" width="100%" height="100%" style="border:0;" loading="lazy"
            src="https://www.google.com/maps?q=Ho%20Chi%20Minh%20City&output=embed"></iframe>
        </div>
      </div>

      <div class="card">
        <h5 style="margin-bottom:16px;">Gửi tin nhắn cho chúng tôi</h5>
        <form id="contact-form">
          <div class="form-group"><label class="form-label">Họ tên</label><input type="text" class="form-control" id="contact-name" required></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" id="contact-email" required></div>
          <div class="form-group"><label class="form-label">Chủ đề</label><input type="text" class="form-control" id="contact-subject"></div>
          <div class="form-group"><label class="form-label">Nội dung</label><textarea class="form-control" id="contact-message" rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary btn-block">Gửi tin nhắn</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container"><div class="footer-bottom"><span>© 2026 VPBot. Bảo lưu mọi quyền.</span></div></div>
</footer>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
$('#contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('button[type="submit"]', e.target);
  setButtonLoading(btn, true, 'Đang gửi...');
  try {
    await Api.sendContactForm({
      name: $('#contact-name').value.trim(),
      email: $('#contact-email').value.trim(),
      subject: $('#contact-subject').value.trim(),
      message: $('#contact-message').value.trim()
    });
    toastSuccess('Gửi tin nhắn thành công! Chúng tôi sẽ phản hồi sớm nhất.');
    e.target.reset();
  } catch (err) {
    toastError(err.message);
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
</body>
</html>
