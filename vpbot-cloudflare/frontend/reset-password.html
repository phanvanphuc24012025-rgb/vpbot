<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div>
      <div class="logo" style="font-size:32px;margin-bottom:16px;">VP<span class="dot" style="color:#fff;opacity:0.7;">Bot</span></div>
      <h2 style="color:#fff;margin-bottom:12px;">Đặt mật khẩu mới</h2>
      <p style="color:rgba(255,255,255,0.85);">Chọn một mật khẩu mạnh để bảo vệ tài khoản của bạn.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <h3 style="margin-bottom:6px;">Đặt lại mật khẩu</h3>
      <p style="margin-bottom:24px;">Nhập mật khẩu mới cho tài khoản của bạn.</p>

      <form id="reset-password-form" novalidate>
        <div class="form-group">
          <label class="form-label">Mật khẩu mới</label>
          <input type="password" class="form-control" id="reset-new-password" placeholder="Tối thiểu 8 ký tự, có chữ và số" required>
        </div>
        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu mới</label>
          <input type="password" class="form-control" id="reset-confirm-password" placeholder="Nhập lại mật khẩu mới" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Lưu mật khẩu mới</button>
      </form>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
