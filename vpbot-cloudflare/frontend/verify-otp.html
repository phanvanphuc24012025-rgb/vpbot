<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác thực OTP - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div>
      <div class="logo" style="font-size:32px;margin-bottom:16px;">VP<span class="dot" style="color:#fff;opacity:0.7;">Bot</span></div>
      <h2 style="color:#fff;margin-bottom:12px;">Gần xong rồi!</h2>
      <p style="color:rgba(255,255,255,0.85);">Nhập mã OTP đã gửi tới email của bạn để hoàn tất.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box text-center">
      <div class="icon-wrap" style="margin:0 auto 20px;width:64px;height:64px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--color-primary);"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </div>
      <h3 style="margin-bottom:6px;">Nhập mã xác thực</h3>
      <p style="margin-bottom:24px;">Mã 6 số đã được gửi tới <strong id="otp-email-display">email của bạn</strong></p>

      <form id="verify-otp-form" novalidate>
        <div class="otp-inputs" style="margin-bottom:20px;">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Xác thực</button>
      </form>

      <div style="margin-top:20px;font-size:14px;">
        <span id="otp-timer" class="hidden" style="color:var(--color-text-muted);"></span>
        <button type="button" id="resend-otp-btn" class="btn btn-ghost btn-sm hidden">Gửi lại mã</button>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/otp.js"></script>
</body>
</html>
