<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div>
      <div class="logo" style="font-size:32px;margin-bottom:16px;">VP<span class="dot" style="color:#fff;opacity:0.7;">Bot</span></div>
      <h2 style="color:#fff;margin-bottom:12px;">Tham gia cùng 1.280+ khách hàng</h2>
      <p style="color:rgba(255,255,255,0.85);">Bảo vệ box Free Fire, tính điểm giải đấu tự động chỉ trong vài phút.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <a href="index.html" style="font-size:14px;color:var(--color-text-muted);">← Về trang chủ</a>
      <h3 style="margin:16px 0 6px;">Tạo tài khoản mới</h3>
      <p style="margin-bottom:24px;">Đăng ký miễn phí, thuê bot chỉ từ 20.000đ/tháng.</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="reg-username" placeholder="4-20 ký tự, không dấu cách" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="reg-email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="reg-password" placeholder="Tối thiểu 8 ký tự, có chữ và số" required>
        </div>
        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu</label>
          <input type="password" class="form-control" id="reg-confirm-password" placeholder="Nhập lại mật khẩu" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Đăng ký</button>
      </form>

      <div class="flex items-center gap-3" style="margin:20px 0;">
        <div style="flex:1;height:1px;background:var(--color-border);"></div>
        <span style="font-size:13px;color:var(--color-text-light);">hoặc</span>
        <div style="flex:1;height:1px;background:var(--color-border);"></div>
      </div>

      <button type="button" class="btn btn-outline btn-block" id="google-login-btn">
        Đăng ký với Google
      </button>

      <p style="text-align:center;margin-top:24px;font-size:14px;">
        Đã có tài khoản? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Đăng nhập</a>
      </p>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>redirectIfAuthed();</script>
</body>
</html>
