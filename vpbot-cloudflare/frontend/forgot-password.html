<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div>
      <div class="logo" style="font-size:32px;margin-bottom:16px;">VP<span class="dot" style="color:#fff;opacity:0.7;">Bot</span></div>
      <h2 style="color:#fff;margin-bottom:12px;">Không sao cả!</h2>
      <p style="color:rgba(255,255,255,0.85);">Nhập email để nhận mã OTP đặt lại mật khẩu.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <a href="login.html" style="font-size:14px;color:var(--color-text-muted);">← Về đăng nhập</a>
      <h3 style="margin:16px 0 6px;">Quên mật khẩu</h3>
      <p style="margin-bottom:24px;">Chúng tôi sẽ gửi mã OTP 6 số tới email của bạn.</p>

      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="forgot-email" placeholder="email@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Gửi mã OTP</button>
      </form>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
