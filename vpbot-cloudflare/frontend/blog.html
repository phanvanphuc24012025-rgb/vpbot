<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - VPBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">VP<span class="dot">Bot</span></a>
    <nav class="nav-menu">
      <a href="index.html">Trang chủ</a>
      <a href="pricing.html">Bảng giá</a>
      <a href="scoring.html">Tính điểm FF</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="contact.html">Liên hệ</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle"></button>
      <a href="login.html" class="btn btn-ghost btn-sm">Đăng nhập</a>
      <a href="register.html" class="btn btn-primary btn-sm">Thuê ngay</a>
      <button class="btn-icon mobile-menu-btn">☰</button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Blog</span>
      <h2>Hướng dẫn &amp; mẹo chơi Free Fire</h2>
      <p>Cập nhật tin tức, hướng dẫn dùng bot và mẹo chơi FF mới nhất.</p>
    </div>
    <div class="grid-3" id="blog-list">
      <!-- Bài viết mẫu tĩnh, JS sẽ thay thế bằng dữ liệu thực từ API nếu có -->
      <div class="card blog-card">
        <div class="skeleton" style="aspect-ratio:16/9;border-radius:10px;margin-bottom:12px;"></div>
        <div class="meta">Đang tải...</div>
      </div>
      <div class="card blog-card">
        <div class="skeleton" style="aspect-ratio:16/9;border-radius:10px;margin-bottom:12px;"></div>
        <div class="meta">Đang tải...</div>
      </div>
      <div class="card blog-card">
        <div class="skeleton" style="aspect-ratio:16/9;border-radius:10px;margin-bottom:12px;"></div>
        <div class="meta">Đang tải...</div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 VPBot. Bảo lưu mọi quyền.</span>
    </div>
  </div>
</footer>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
async function loadBlogList() {
  const list = $('#blog-list');
  try {
    const data = await Api.getBlogPosts();
    const posts = data.posts || [];
    if (!posts.length) {
      list.innerHTML = '<p class="text-center" style="grid-column:1/-1;color:var(--color-text-muted);">Chưa có bài viết nào</p>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <a href="blog-detail.html?slug=${encodeURIComponent(p.slug)}" class="card blog-card">
        <img src="${p.coverImage || 'https://via.placeholder.com/400x225'}" alt="${escapeHtml(p.title)}">
        <div class="meta">${formatDate(p.createdAt)}</div>
        <h4>${escapeHtml(p.title)}</h4>
        <p>${escapeHtml(p.excerpt || '')}</p>
      </a>
    `).join('');
  } catch (err) {
    list.innerHTML = `<p class="text-center" style="grid-column:1/-1;">Không tải được bài viết: ${escapeHtml(err.message)}</p>`;
  }
}
document.addEventListener('DOMContentLoaded', loadBlogList);
</script>
</body>
</html>
